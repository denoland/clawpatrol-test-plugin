name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build and package
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for pl in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            os="${pl%_*}"; arch="${pl#*_}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-s -w" -trimpath -o "$REPO" .
            tar -C . -czf "dist/${REPO}_${VER}_${pl}.tar.gz" "$REPO"
            rm "$REPO"
          done
          # Static manifest (platform-independent): build for the runner
          # and emit it for clawpatrol to inspect before downloading.
          CGO_ENABLED=0 go build -o "$REPO" .
          ./"$REPO" --print-manifest > "dist/${REPO}_${VER}_manifest.json"
          rm "$REPO"
          ( cd dist && shasum -a 256 *.tar.gz *_manifest.json > "${REPO}_${VER}_SHA256SUMS" )
          ls -l dist

      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_manifest.json

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
